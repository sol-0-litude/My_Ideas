name: Build index

on:
  push:
    branches: [main]
    paths:
      - 'notes/**'
      - 'files/**'
      - 'running_file/**'
      - '.github/workflows/build-index.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build index.json
        run: |
          python3 - <<'PY'
          import json, os, subprocess

          def git(*a):
              return subprocess.check_output(['git', *a], text=True).strip()

          out = {}
          for key, d in (('notes', 'notes'), ('files', 'files'), ('running', 'running_file')):
              items = []
              if os.path.isdir(d):
                  for n in sorted(os.listdir(d)):
                      p = d + '/' + n
                      if n.startswith('.') or not os.path.isfile(p):
                          continue
                      items.append({
                          'name': n,
                          'path': p,
                          'size': os.path.getsize(p),
                          'date': git('log', '-1', '--format=%cI', '--', p),
                          'v': git('log', '-1', '--format=%h', '--', p),
                      })
              out[key] = items

          with open('index.json', 'w') as f:
              json.dump(out, f, indent=1)
          PY

      - name: Commit index.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.json
          git diff --cached --quiet || (git commit -m "Update index.json" && git push)
